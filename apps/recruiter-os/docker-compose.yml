# ---------------------------------------------------------------------------
# Local development and demonstration stack.
#
#   docker compose up --build
#
# It brings up PostgreSQL, Mailpit, the application and the worker, applies the
# migrations and seeds the fictional demo workspace. It is a DEVELOPMENT and
# DEMONSTRATION compose file: it uses plain HTTP, a fixed local password and a
# committed auth secret, none of which belong in a real deployment. See
# DEPLOYMENT.md.
# ---------------------------------------------------------------------------
name: recruiteros

x-app-env: &app-env
  APP_MODE: DEMO
  DEMO_TOOLS_ENABLED: "true"
  DATABASE_URL: postgresql://recruiteros:local-development-only@postgres:5432/recruiteros?schema=public
  TEST_DATABASE_URL: postgresql://recruiteros:local-development-only@postgres:5432/recruiteros_test?schema=public
  BETTER_AUTH_SECRET: compose-local-development-secret-not-for-real-use-000
  BETTER_AUTH_URL: http://localhost:3000
  PUBLIC_APP_URL: http://localhost:3000
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  MAIL_FROM: RecruiterOS <no-reply@recruiteros.invalid>
  WORKER_PORT: "3001"
  LOG_LEVEL: info

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: recruiteros
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: recruiteros
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recruiteros -d recruiteros"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    # Captures invitation and password-reset email locally. Nothing leaves the
    # machine, so the flows can be exercised end to end safely.
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: "500"

  migrate:
    build:
      context: .
      target: runtime
    environment: *app-env
    command: ["pnpm", "exec", "prisma", "migrate", "deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      target: runtime
    environment: *app-env
    # Seeds the fictional demo workspace. It refuses to run unless
    # APP_MODE=DEMO, and it never touches a live-scoped organization.
    command: ["pnpm", "run", "seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  app:
    build:
      context: .
      target: runtime
    environment: *app-env
    ports:
      - "3000:3000"
    depends_on:
      seed:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      target: runtime
    environment: *app-env
    command: ["pnpm", "run", "worker"]
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
